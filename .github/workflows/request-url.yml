name: Request CLI Proxy API

on:
  schedule:
    # GitHub Actions uses UTC time.
    # Runs every 5 minutes.
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Request URL
        run: |
          date -u
          curl --fail --silent --show-error \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --write-out "\nHTTP status: %{http_code}\n" \
            "https://cli-proxy-api-production-e468.up.railway.app"
